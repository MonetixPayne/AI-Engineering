[project]
name = "enrich"
version = "0.1.0"
description = "Phase 0 artifact: typed LLM call path with cost and latency accounting."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "selectolax>=0.3",
    "anthropic>=0.40",
]

[project.scripts]
enrich = "enrich.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
